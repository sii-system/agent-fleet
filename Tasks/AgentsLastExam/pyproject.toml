[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet-ale"
version = "0.1.0"
description = "Agents' Last Exam CPU benchmark through Harbor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "harbor==0.18.0",
  "e2b==2.32.1",
  "dockerfile-parse==2.0.1",
  "PyYAML==6.0.3",
]

[tool.hatch.build.targets.wheel]
packages = ["ale_adapter"]
