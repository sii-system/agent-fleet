[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet-waa"
version = "0.1.0"
description = "WindowsAgentArena and WindowsAgentArena-V2 Harbor adapters on KubeVirt VMs"
requires-python = ">=3.12,<3.13"
dependencies = [
  "harbor==0.18.0",
  "PyYAML==6.0.3",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "pillow>=11,<13",
  "gymnasium==1.1.1",
  "requests[socks]>=2.32,<3",
  "httpx[socks]>=0.28,<0.29",
  "requests-toolbelt==1.0.0",
  "playwright>=1.55,<2",
  "pydrive==1.3.1",
  "formulas>=1.3,<2",
  "lxml>=5,<7",
  "cssselect>=1.2,<2",
  "xmltodict>=0.14,<2",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "odfpy==1.4.1",
  "rapidfuzz>=3.9,<4",
  "scikit-image==0.25.2",
  "beautifulsoup4>=4.13,<5",
  "pymupdf==1.26.5",
  "borb==2.1.25",
  "PyPDF2==3.0.1",
  "pdfplumber>=0.11,<1",
  "py7zr==0.22.0",
  "LnkParse3>=1.5,<2",
  "pyacoustid>=1.3,<2",
  "opencv-python-headless==4.11.0.86",
  "imagehash>=4.3,<5",
  "librosa==0.11.0",
  "fastdtw==0.3.4",
  "scipy>=1.13,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/waa_benchmark"]

[tool.uv.extra-build-dependencies]
fastdtw = ["numpy==1.26.4", "cython<3"]
